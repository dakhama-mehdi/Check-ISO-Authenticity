name: Build OS Library

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-os-library:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OS library builder
        shell: pwsh
        run: |
          .\work\Build-OSLibrary.ps1

      - name: Commit generated OS library
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Database/os

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "No OS library changes"
          }
          else {
            git commit -m "Update OS library"
            git push
          }
