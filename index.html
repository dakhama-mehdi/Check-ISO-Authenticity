<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheckISO Search</title>

<style>
body{
    background:#1e1e1e;
    color:#ffffff;
    font-family:Arial;
    margin:40px;
}

h1{
    color:#4fc3f7;
}

input{
    width:100%;
    max-width:900px;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:8px;
    margin-bottom:10px;
}

button{
    padding:12px 20px;
    background:#4fc3f7;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

.result{
    margin-top:20px;
    background:#2b2b2b;
    padding:20px;
    border-radius:10px;
    white-space:pre-wrap;
    overflow:auto;
}

.info{
    margin-top:10px;
    color:#bbbbbb;
}
</style>
</head>

<body>

<h1>CheckISO Hash Search V5</h1>

<input
    type="text"
    id="searchInput"
    placeholder="Collez un SHA256 ou un nom ISO..."
>

<button onclick="searchISO()">Rechercher</button>

<div class="info" id="info"></div>

<div class="result" id="result">
En attente...
</div>

<script>

async function loadJsonFile(url){

    const response = await fetch(url + "?v=" + Date.now(), {
        cache: "no-store"
    });

    if(!response.ok){
        return [];
    }

    const data = await response.json();

    return Array.isArray(data)
        ? data
        : [data];
}

async function searchISO(){

    const resultBox =
        document.getElementById("result");

    const infoBox =
        document.getElementById("info");

    const search =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if(search.length === 0){
        return;
    }

    const start = performance.now();

    let results = [];

    // Recherche SHA256
    if(search.match(/^[a-f0-9]{4,64}$/)){

        const prefix = search.substring(0,1);

        infoBox.innerText =
            "Recherche SHA256 dans " +
            prefix + ".json";

        const data = await loadJsonFile(
            "./Database/hash/" + prefix + ".json"
        );

        results = data.filter(x => {

            const hash =
                (x.SHA256 || "")
                .toLowerCase()
                .trim();

            return hash.startsWith(search);
        });
    }

    // Recherche NOM ISO
    else{

        infoBox.innerText =
            "Recherche nom ISO dans tous les index...";

        const chars =
            "0123456789abcdef".split("");

        for(const c of chars){

            const data = await loadJsonFile(
                "./Database/hash/" + c + ".json"
            );

            const matches = data.filter(x => {

                const name =
                    (x.Name || "")
                    .toLowerCase();

                return name.includes(search);
            });

            results.push(...matches);
        }
    }

    const elapsed =
        (performance.now() - start).toFixed(2);

    if(results.length === 0){

        resultBox.innerText =
            "Aucun résultat.\nTemps : " +
            elapsed + " ms";

        return;
    }

    resultBox.innerText =
        "Résultats : " +
        results.length +
        "\nTemps : " +
        elapsed +
        " ms\n\n" +
        JSON.stringify(results, null, 2);
}

</script>

</body>
</html>
