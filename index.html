<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheckISO Search V2</title>

<style>
body{
    background:#1e1e1e;
    color:#ffffff;
    font-family:Arial;
    margin:40px;
}

h1{
    color:#4fc3f7;
}

input{
    width:100%;
    max-width:900px;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:8px;
    margin-bottom:10px;
}

button{
    padding:12px 20px;
    background:#4fc3f7;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

.result{
    margin-top:20px;
    background:#2b2b2b;
    padding:20px;
    border-radius:10px;
    white-space:pre-wrap;
    overflow:auto;
}

.info{
    margin-top:10px;
    color:#bbbbbb;
}
</style>
</head>

<body>

<h1>CheckISO Hash Search</h1>

<input
    type="text"
    id="searchInput"
    placeholder="Collez un SHA256 ou un nom ISO..."
>

<button onclick="searchISO()">Rechercher</button>

<div class="info" id="info"></div>

<div class="result" id="result">
En attente...
</div>

<script>

let cache = {};

async function loadHashFile(prefix){

    if(cache[prefix]){
        return cache[prefix];
    }

    const response = await fetch("./Database/hash/" + prefix + ".json");

    if(!response.ok){
        cache[prefix] = [];
        return cache[prefix];
    }

    cache[prefix] = await response.json();

    if(!Array.isArray(cache[prefix])){
        cache[prefix] = [cache[prefix]];
    }

    return cache[prefix];
}

async function searchISO(){

    const resultBox = document.getElementById("result");
    const infoBox = document.getElementById("info");

    const search = document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if(search.length === 0){
        return;
    }

    if(!search.match(/^[a-f0-9]{1,64}$/)){

        resultBox.innerText =
            "Recherche SHA256 uniquement.\nCollez un hash complet ou le début du hash.";

        return;
    }

    const prefix = search.substring(0,1);

    infoBox.innerText =
        "Chargement de l'index : " + prefix + ".json";

    const start = performance.now();

    const data = await loadHashFile(prefix);

    const results = data.filter(x => {
        const hash = (x.SHA256 || "").toLowerCase();
        return hash.startsWith(search);
    });

    const elapsed = (performance.now() - start).toFixed(2);

    infoBox.innerText =
        "Index chargé : " + prefix + ".json | " +
        data.length + " entrées";

    if(results.length === 0){

        resultBox.innerText =
            "Aucun résultat.\nTemps : " + elapsed + " ms";

        return;
    }

    resultBox.innerText =
        "Résultats : " + results.length +
        "\nTemps : " + elapsed + " ms\n\n" +
        JSON.stringify(results, null, 2);
}

</script>

</body>
</html>
