<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheckISO Search</title>

<style>
body{
    background:#1e1e1e;
    color:#ffffff;
    font-family:Arial;
    margin:40px;
}

h1{
    color:#4fc3f7;
}

input{
    width:100%;
    max-width:600px;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:8px;
    margin-bottom:10px;
}

button{
    padding:12px 20px;
    background:#4fc3f7;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

.result{
    margin-top:0px;
    background:#2b2b2b;
    padding:8px 20px 20px 20px;
    border-radius:10px;
    overflow:auto;
}
.resultTable td,
.resultTable th{
    border:1px solid #3a3a3a;
}

.info{
    margin-top:0px;
    color:#bbbbbb;
}

.resultTable{
    width:100%;
    border-collapse:collapse;
    margin-top:0 !important;
    font-size:14px;
}

.resultTable th{
    background:#4fc3f7;
    color:#000;
    padding:10px;
    text-align:left;
}

.resultTable td{
    border-bottom:1px solid #3a3a3a;
    padding:10px 8px;
    background:#262626;
}

.resultTable tr:nth-child(even) td{
    background:#2f2f2f;
}

.resultTable tr:hover{
    background:#333;
}

.hash{
    font-family:Consolas;
    font-size:12px;
    word-break:break-all;
}

.stats{
    margin-top:5px;
    margin-bottom:15px;
    display:flex;
    gap:20px;
    font-size:14px;
    color:#bbbbbb;
}
</style>
</head>

<body>

<h1>CheckISO Hash Search V5.4</h1>

<input
    type="text"
    id="searchInput"
    placeholder="Collez un SHA256 ou un nom ISO..."
    onkeyup="handleSearchInput(event)"
>

<button onclick="searchISO()">Rechercher</button>

<div class="info" id="info"></div>

<div class="result" id="result">
En attente...
</div>

<script>

const BASE_URL = "/Check-ISO-Authenticity";

async function loadJsonFile(path){

    const url = BASE_URL + path + "?v=" + Date.now();

    const response = await fetch(url, {
        cache: "no-store"
    });

    if(!response.ok){
        return [];
    }

    const data = await response.json();

    return Array.isArray(data) ? data : [data];
}

async function searchISO(){

    const resultBox = document.getElementById("result");
    const infoBox = document.getElementById("info");

    const search = document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if(search.length === 0){
        return;
    }

    const start = performance.now();
    let results = [];

    if(search.match(/^[a-f0-9]{30,64}$/)){

        const prefix = search.substring(0,1);

        infoBox.innerText = "Recherche SHA256 dans " + prefix + ".json";

        const data = await loadJsonFile(
            "/Database/hash/" + prefix + ".json"
        );

        results = data.filter(x => {
            const hash = (x.SHA256 || "").toLowerCase().trim();
            return hash.startsWith(search);
        });
    }
    else{

        infoBox.innerText = "Recherche nom ISO dans tous les index...";

        const chars = "0123456789abcdef".split("");

        for(const c of chars){

            const data = await loadJsonFile(
                "/Database/hash/" + c + ".json"
            );

            const matches = data.filter(x => {
                // const name = (x.Name || "").toLowerCase();
				const name = (x.OS || "").toLowerCase();
                return name.includes(search);
            });

            results.push(...matches);
        }
    }

    const elapsed = (performance.now() - start).toFixed(2);

    if(results.length === 0){
        infoBox.innerText = "";
        resultBox.innerText =
            "Aucun résultat.\nTemps : " + elapsed + " ms";
        return;
    }

    infoBox.innerHTML = `
        <div class="stats">
            <span>Résultats : ${results.length}</span>
            <span>Temps : ${elapsed} ms</span>
        </div>
    `;

    let html = `
        <table id="resultTable" class="resultTable">
        <thead>
        <tr>
            <th>OS</th>
            <th onclick="sortTableByVersion()" style="cursor:pointer">
    		Version ▲▼
			</th>
            <th>ISO</th>
            <th>SHA256</th>
            <th>Source</th>
        </tr>
        </thead>
        <tbody>
    `;

	results.sort((a, b) => {
    const va = (a.Version || "").toString();
    const vb = (b.Version || "").toString();
	
   return vb.localeCompare(
        va,
        undefined,
        { numeric:true }
    );
	});
    for(const item of results.slice(0,100)){

        html += `
            <tr>
                <td>${item.OS || ""}</td>
                <td>${item.Version || ""}</td>
                <td>${item.Name || ""}</td>
                <td class="hash">${item.SHA256 || ""}</td>
                <td>${item.TrustLevel || ""}</td>
            </tr>
        `;
    }

    html += `
        </tbody>
        </table>
    `;

    resultBox.innerHTML = html;
}

function filterTable(value){

    const filter = value.toLowerCase();

    const rows = document.querySelectorAll("#resultTable tbody tr");

    rows.forEach(row => {

        const text = row.innerText.toLowerCase();

        row.style.display = text.includes(filter)
            ? ""
            : "none";
    });
}

function handleSearchInput(event){

	if(event.target.value.trim() === ""){

        document.getElementById("result").innerHTML = "En attente...";
        document.getElementById("info").innerHTML = "";

        return;
    }

    const table = document.getElementById("resultTable");

    if(table){

        filterTable(event.target.value);
        return;
    }

    if(event.key === "Enter"){

        searchISO();
    }
}

let versionSortAsc = true;

function sortTableByVersion(){

    const table = document.getElementById("resultTable");
    const tbody = table.querySelector("tbody");

    const rows = Array.from(
        tbody.querySelectorAll("tr")
    );

    rows.sort((a, b) => {

        const va = (a.children[1].innerText || "").trim();
		const vb = (b.children[1].innerText || "").trim();

        return versionSortAsc
            ? va.localeCompare(vb, undefined, {
                numeric:true
            })
            : vb.localeCompare(va, undefined, {
                numeric:true
            });
    });

    versionSortAsc = !versionSortAsc;

    rows.forEach(row => {
        tbody.appendChild(row);
    });
}

</script>

</body>
</html>
