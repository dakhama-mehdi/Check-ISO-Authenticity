<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheckISO Search</title>

<style>
:root{
    --bg:#111820;
    --panel:#18222d;
    --panel2:#202c38;
    --text:#f2f6fa;
    --muted:#9aa8b5;
    --blue:#4fc3f7;
    --border:#334252;
}

*{
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial, sans-serif;
    margin:0;
    padding:32px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:22px;
    margin-bottom:18px;
}

.brand h1{
    margin:0;
    font-size:34px;
    color:var(--text);
}

.brand h1 span{
    color:var(--blue);
}

.brand p{
    margin:6px 0 0 0;
    color:var(--muted);
    font-size:15px;
}

.links{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
}

.links a{
    color:var(--muted);
    text-decoration:none;
    font-size:14px;
}

.links a:hover{
    color:var(--blue);
}

.searchBox,
.statsBox,
.result{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    margin-bottom:16px;
}

.searchLine{
    display:flex;
    gap:12px;
}

input{
    width:100%;
    padding:14px;
    font-size:16px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#101822;
    color:var(--text);
}

input:focus{
    outline:none;
    border-color:var(--blue);
}

button{
    padding:12px 18px;
    background:var(--blue);
    color:#061018;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

button:hover{
    opacity:0.9;
}

.examples{
    margin-top:12px;
    color:var(--muted);
    font-size:13px;
}

.examples span{
    display:inline-block;
    background:var(--panel2);
    border:1px solid var(--border);
    padding:5px 9px;
    border-radius:6px;
    margin:4px 4px 0 4px;
    color:#dbe6ef;
}

.statsBox{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
}

.compactStats{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    background:transparent;
    border:none;
    padding:0;
    margin:0;
}

.statItem{
    border-right:1px solid var(--border);
    padding-right:12px;
}

.compactStats .statItem{
    min-width:auto;
    padding-right:18px;
}

.statItem:last-child{
    border-right:none;
}

.statLabel{
    color:var(--muted);
    font-size:13px;
    margin-bottom:6px;
}

.compactStats .statLabel{
    font-size:12px;
    margin-bottom:3px;
}

.statValue{
    color:var(--blue);
    font-size:18px;
}

.compactStats .statValue{
    font-size:14px;
}

.info{
    color:var(--muted);
    margin:0 0 12px 0;
}

.topResultLine{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
    flex-wrap:wrap;
}

.resultStats{
    display:flex;
    gap:18px;
    align-items:center;
    color:var(--muted);
    font-size:14px;
    flex-wrap:wrap;
}

.resultStats strong{
    color:var(--text);
}

.pagination{
    display:flex;
    gap:8px;
    align-items:center;
    color:var(--muted);
    font-size:14px;
}

.pageBtn{
    padding:4px 10px;
    font-size:12px;
    min-width:34px;
}

.resultTable{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

.resultTable th,
.resultTable td{
    border:1px solid var(--border);
    padding:10px 8px;
}

.resultTable th{
    background:var(--blue);
    color:#061018;
    text-align:left;
}

.resultTable td{
    background:#151f2a;
}

.resultTable tr:nth-child(even) td{
    background:#1b2632;
}

.resultTable tr:hover td{
    background:#263545;
}

.hash{
    font-family:Consolas, monospace;
    font-size:12px;
    word-break:break-all;
}

.badge{
    display:inline-block;
    padding:3px 7px;
    border-radius:999px;
    background:#263545;
    color:#dbe6ef;
    font-size:12px;
}

.footer{
    margin-top:20px;
    color:var(--muted);
    font-size:13px;
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
}

@media(max-width:800px){
    body{
        padding:18px;
    }

    .header,
    .searchLine{
        flex-direction:column;
        align-items:stretch;
    }

    .compactStats{
        flex-wrap:wrap;
        justify-content:flex-start;
    }

    .statsBox{
        grid-template-columns:1fr 1fr;
    }

    .statItem,
    .compactStats .statItem{
        border-right:none;
        padding-right:0;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="brand">
        <h1>Check<span>ISO</span></h1>
        <p>Linux ISO hash search</p>
    </div>

    <div class="statsBox compactStats" id="projectStats">
        <div class="statItem">
            <div class="statLabel">Hashes</div>
            <div class="statValue" id="totalHashes">-</div>
        </div>

        <div class="statItem">
            <div class="statLabel">Distributions</div>
            <div class="statValue" id="totalDistributions">-</div>
        </div>

        <div class="statItem">
            <div class="statLabel">Mise à jour</div>
            <div class="statValue" id="lastUpdate">-</div>
        </div>

        <div class="statItem">
            <div class="statLabel">Auteur</div>
            <div class="statValue" id="authorName">Dakhama Mehdi</div>
        </div>
    </div>

    <div class="links">
        <a href="#" title="Aide">Aide</a>
        <a href="#" title="Article">Article</a>
        <a href="https://github.com/dakhama-mehdi/Check-ISO-Authenticity" target="_blank">GitHub</a>
    </div>
</div>

<div class="searchBox">
    <div class="searchLine">
        <input
            type="text"
            id="searchInput"
            placeholder="Collez un SHA256 ou un nom ISO / distribution..."
            onkeyup="handleSearchInput(event)"
        >

        <button onclick="searchISO()">Rechercher</button>
    </div>

</div>


<div class="result" id="result">
    <div class="info" id="info">En attente...</div>
</div>

<div class="footer">
    <span>CheckISO © 2026 - Dakhama Mehdi</span>
    <span>Base communautaire de hashes ISO</span>
</div>

<script>

// const BASE_URL = "https://dakhama-mehdi.github.io/Check-ISO-Authenticity";
const BASE_URL = "/Check-ISO-Authenticity";

let allResults = [];
let filteredResults = [];
let currentPage = 1;
let versionSortAsc = false;
let lastElapsed = "0";
const pageSize = 50;

const OS_ALIASES = {
    "alma": "almalinux",
    "almalinux": "almalinux",
    "rocky": "rocky",
    "rockylinux": "rocky",
    "ubuntu": "ubuntu",
    "debian": "debian",
    "kali": "kali",
    "fedora": "fedora",
    "oracle": "oraclelinux",
    "oraclelinux": "oraclelinux",
    "mint": "linuxmint",
    "linuxmint": "linuxmint",
    "freebsd": "freebsd",
    "suse": "opensuse",
    "opensuse": "opensuse"
};

async function loadJsonFile(path){

    const url = BASE_URL + path + "?v=" + Date.now();

    try{
        const response = await fetch(url, {
            cache: "no-store"
        });

        if(!response.ok){
            return [];
        }

        const data = await response.json();

        return Array.isArray(data) ? data : [data];
    }
    catch{
        return [];
    }
}

async function loadProjectStats(){

    const stats = await loadJsonFile("/Database/stats.json");

    if(stats.length === 0){
        return;
    }

    const s = stats[0];

    document.getElementById("totalHashes").innerText = s.TotalHashes || "-";
    document.getElementById("totalDistributions").innerText = s.Distributions || "-";
    document.getElementById("lastUpdate").innerText = s.LastUpdate || "-";
    document.getElementById("authorName").innerText = s.Author || "Dakhama Mehdi";
}

function normalizeOsKey(value){

    const clean = value
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");

    if(OS_ALIASES[clean]){
        return OS_ALIASES[clean];
    }

    if(clean.length >= 4){
        for(const key in OS_ALIASES){
            if(key.startsWith(clean) || clean.startsWith(key)){
                return OS_ALIASES[key];
            }
        }
    }

    return null;
}

async function searchISO(){

    const resultBox = document.getElementById("result");
    const infoBox = document.getElementById("info");

    const search = document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if(search.length === 0){
        resetSearch();
        return;
    }

    const start = performance.now();
    let results = [];

    if(search.match(/^[a-f0-9]{30,64}$/)){

        const prefix = search.substring(0,1);
        infoBox.innerText = "Recherche SHA256 dans " + prefix + ".json";

        const data = await loadJsonFile(
            "/Database/hash/" + prefix + ".json"
        );

        results = data.filter(x => {
            const hash = (x.SHA256 || "").toLowerCase().trim();
            return hash.startsWith(search);
        });
    }
    else{

        const osKey = normalizeOsKey(search);

        if(osKey){
            infoBox.innerText = "Recherche dans l'index " + osKey + "...";

            results = await loadJsonFile(
                "/Database/os/" + osKey + ".json"
            );

            if(results.length === 0){
                results = await searchAllIndexes(search);
            }
        }
        else{
            infoBox.innerText = "Recherche globale dans tous les index...";
            results = await searchAllIndexes(search);
        }
    }

    lastElapsed = (performance.now() - start).toFixed(2);

    if(results.length === 0){
        allResults = [];
        filteredResults = [];
        resultBox.innerHTML = `<div class="info">Aucun résultat.<br>Temps : ${lastElapsed} ms</div>`;
        return;
    }

    results.sort(compareVersionDesc);

    allResults = results;
    filteredResults = results;
    currentPage = 1;

    renderTablePage();
}

async function searchAllIndexes(search){

    let results = [];
    const chars = "0123456789abcdef".split("");

    for(const c of chars){

        const data = await loadJsonFile(
            "/Database/hash/" + c + ".json"
        );

        const matches = data.filter(x => {

            const text = [
                x.OS,
                x.Version,
                x.Name,
                x.SHA256,
                x.TrustLevel
            ].join(" ").toLowerCase();

            return text.includes(search);
        });

        results.push(...matches);
    }

    return results;
}

function renderTablePage(){

    const resultBox = document.getElementById("result");

    const totalPages = Math.max(
        1,
        Math.ceil(filteredResults.length / pageSize)
    );

    if(currentPage > totalPages){
        currentPage = totalPages;
    }

    const start = (currentPage - 1) * pageSize;
    const pageItems = filteredResults.slice(start, start + pageSize);

    let html = `
        <div class="topResultLine">
            <div class="resultStats">
                <span>Résultats : <strong>${filteredResults.length}</strong></span>
                <span>Temps : <strong>${lastElapsed} ms</strong></span>
            </div>

            <div class="pagination">
                <button class="pageBtn" onclick="prevPage()">&lt;</button>
                <span>Page ${currentPage} / ${totalPages}</span>
                <button class="pageBtn" onclick="nextPage()">&gt;</button>
            </div>
        </div>

        <table id="resultTable" class="resultTable">
        <thead>
        <tr>
            <th>OS</th>
            <th onclick="sortTableByVersion()" style="cursor:pointer">Version ▲▼</th>
            <th>ISO</th>
            <th>SHA256</th>
            <th>Source</th>
        </tr>
        </thead>
        <tbody>
    `;

    for(const item of pageItems){

        html += `
            <tr>
                <td>${escapeHtml(item.OS || "")}</td>
                <td>${escapeHtml(item.Version || "")}</td>
                <td>${escapeHtml(item.Name || "")}</td>
                <td class="hash">${escapeHtml(item.SHA256 || "")}</td>
                <td><span class="badge">${escapeHtml(item.TrustLevel || "")}</span></td>
            </tr>
        `;
    }

    html += `
        </tbody>
        </table>
    `;

    resultBox.innerHTML = html;
}

function handleSearchInput(event){

    const value = event.target.value.trim();

    if(value === ""){
        resetSearch();
        return;
    }

    if(allResults.length > 0){
        filterCurrentResults(value);
        return;
    }

    if(event.key === "Enter"){
        searchISO();
    }
}

function filterCurrentResults(value){

    const filter = value.toLowerCase().trim();

    filteredResults = allResults.filter(item => {

        const text = [
            item.OS,
            item.Version,
            item.Name,
            item.SHA256,
            item.TrustLevel
        ].join(" ").toLowerCase();

        return text.includes(filter);
    });

    currentPage = 1;
    renderTablePage();
}

function sortTableByVersion(){

    filteredResults.sort((a, b) => {

        const va = (a.Version || "").toString();
        const vb = (b.Version || "").toString();

        return versionSortAsc
            ? va.localeCompare(vb, undefined, { numeric:true })
            : vb.localeCompare(va, undefined, { numeric:true });
    });

    versionSortAsc = !versionSortAsc;
    currentPage = 1;
    renderTablePage();
}

function compareVersionDesc(a, b){

    const va = (a.Version || "").toString();
    const vb = (b.Version || "").toString();

    return vb.localeCompare(
        va,
        undefined,
        { numeric:true }
    );
}

function nextPage(){

    const totalPages = Math.ceil(filteredResults.length / pageSize);

    if(currentPage < totalPages){
        currentPage++;
        renderTablePage();
    }
}

function prevPage(){

    if(currentPage > 1){
        currentPage--;
        renderTablePage();
    }
}

function resetSearch(){

    allResults = [];
    filteredResults = [];
    currentPage = 1;
    lastElapsed = "0";

    document.getElementById("result").innerHTML =
        `<div class="info" id="info">En attente...</div>`;
}

function escapeHtml(value){

    return value
        .toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

loadProjectStats();

</script>

</body>
</html>
